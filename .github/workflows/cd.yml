# FieldOps360 - CD Pipeline
# Deploys to K3s after CI passes

name: CD

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop, main]

jobs:
  deploy-dev:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'develop'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Skip outdated run
        id: guard
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          SHA="${{ github.event.workflow_run.head_sha }}"
          LATEST="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"

          echo "workflow sha: $SHA"
          echo "branch latest: $LATEST"

          if [ "$SHA" != "$LATEST" ]; then
            echo "Outdated CD run detected. Skipping deployment."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to dev namespace
        if: steps.guard.outputs.skip != 'true'
        run: |
          NAMESPACE="fieldops-dev"

          for SERVICE in auth-service project-service resource-service planning-service reporting-service; do
            if kubectl get deployment $SERVICE -n $NAMESPACE 2>/dev/null; then
              kubectl rollout restart deployment/$SERVICE -n $NAMESPACE
              kubectl rollout status deployment/$SERVICE -n $NAMESPACE --timeout=120s
            fi
          done

      - name: Status
        if: steps.guard.outputs.skip != 'true'
        run: kubectl get pods -n fieldops-dev

  deploy-prod:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Skip outdated run
        id: guard
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          SHA="${{ github.event.workflow_run.head_sha }}"
          LATEST="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"

          echo "workflow sha: $SHA"
          echo "branch latest: $LATEST"

          if [ "$SHA" != "$LATEST" ]; then
            echo "Outdated CD run detected. Skipping deployment."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to prod namespace
        if: steps.guard.outputs.skip != 'true'
        run: |
          NAMESPACE="fieldops-prod"

          for SERVICE in auth-service project-service resource-service planning-service reporting-service; do
            if kubectl get deployment $SERVICE -n $NAMESPACE 2>/dev/null; then
              kubectl rollout restart deployment/$SERVICE -n $NAMESPACE
              kubectl rollout status deployment/$SERVICE -n $NAMESPACE --timeout=180s
            fi
          done

      - name: Status
        if: steps.guard.outputs.skip != 'true'
        run: kubectl get pods -n fieldops-prod
