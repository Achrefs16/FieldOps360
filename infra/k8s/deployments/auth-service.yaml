
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service
  namespace: fieldops-auth

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: fieldops-auth
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-extra-secret: "vault-approle-auth"
        vault.hashicorp.com/auth-type: "approle"
        vault.hashicorp.com/auth-path: "auth/approle"
        vault.hashicorp.com/auth-config-role-id-file-path: "/vault/custom/role-id"
        vault.hashicorp.com/auth-config-secret-id-file-path: "/vault/custom/secret-id"
        vault.hashicorp.com/role: "auth-service"
        vault.hashicorp.com/agent-inject-secret-db: "secret/data/postgresql"
        vault.hashicorp.com/agent-inject-template-db: |
          {{- with secret "secret/data/postgresql" -}}
          export DB_PASSWORD="{{ .Data.data.password }}"
          {{- end -}}
        vault.hashicorp.com/agent-inject-secret-redis: "secret/data/redis"
        vault.hashicorp.com/agent-inject-template-redis: |
          {{- with secret "secret/data/redis" -}}
          export REDIS_PASSWORD="{{ .Data.data.password }}"
          {{- end -}}
        vault.hashicorp.com/agent-inject-secret-minio: "secret/data/minio"
        vault.hashicorp.com/agent-inject-template-minio: |
          {{- with secret "secret/data/minio" -}}
          export MINIO_ACCESS_KEY="{{ .Data.data.access_key }}"
          export MINIO_SECRET_KEY="{{ .Data.data.secret_key }}"
          {{- end -}}
        vault.hashicorp.com/agent-inject-secret-smtp: "secret/data/fieldops/smtp"
        vault.hashicorp.com/agent-inject-template-smtp: |
          {{- with secret "secret/data/fieldops/smtp" -}}
          export SMTP_USER="{{ .Data.data.smtp_user }}"
          export SMTP_PASS="{{ .Data.data.smtp_pass }}"
          {{- end }}
    spec:
      serviceAccountName: auth-service
      automountServiceAccountToken: true  # Required for Vault auth
      containers:
        - name: auth-service
          image: achrefs161/fieldops-auth-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              protocol: TCP
          
          # Source Vault-injected secrets before starting app
          command: ["/bin/sh"]
          args:
            - -c
            - |
              source /vault/secrets/db
              source /vault/secrets/redis
              source /vault/secrets/minio
              source /vault/secrets/smtp
              export PLATFORM_DATABASE_URL="postgresql://postgres:${DB_PASSWORD}@postgresql.fieldops-data.svc.cluster.local:5432/fieldops_platform"
              exec node dist/main
          
          envFrom:
            - configMapRef:
                name: auth-service-config
          
          env:
            
            # JWT keys (from K8s secret volume)
            - name: JWT_PRIVATE_KEY_PATH
              value: "/etc/jwt/private.pem"
            - name: JWT_PUBLIC_KEY_PATH
              value: "/etc/jwt/public.pem"
          
          volumeMounts:
            - name: jwt-keys
              mountPath: /etc/jwt
              readOnly: true
          
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          
          livenessProbe:
            httpGet:
              path: /api/auth/v1/health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /api/auth/v1/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
      
      volumes:
        - name: jwt-keys
          secret:
            secretName: jwt-keys
            defaultMode: 0400
      
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
