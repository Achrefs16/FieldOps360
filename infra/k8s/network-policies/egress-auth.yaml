apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-service-egress
  namespace: fieldops-auth
spec:
  podSelector:
    matchLabels:
      app: auth-service
  policyTypes:
    - Egress
  egress:
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow cross-namespace access to data tier
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fieldops-data
      ports:
        - protocol: TCP
          port: 5432  # PostgreSQL
        - protocol: TCP
          port: 6379  # Redis
        - protocol: TCP
          port: 5672  # RabbitMQ
        - protocol: TCP
          port: 9000  # MinIO
    # Allow OTLP export to observability stack
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fieldops-observability
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
