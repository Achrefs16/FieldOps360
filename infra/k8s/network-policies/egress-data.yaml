apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-egress-restricted
  namespace: fieldops-data
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow Vault Agent Injector communication (required for backup CronJobs)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vault-agent-injector
      ports:
        - protocol: TCP
          port: 8080
    # Allow pods to reach Vault server (for secret retrieval)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
      ports:
        - protocol: TCP
          port: 8200
    # Allow MinIO access within namespace (for backup uploads)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: minio
      ports:
        - protocol: TCP
          port: 9000
