# Allow backup-job pods to reach PostgreSQL, Redis, and MinIO within fieldops-data
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backup-to-databases
  namespace: fieldops-data
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backup-job
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 9000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: fieldops-gateway
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow application services to send traces to Jaeger collector
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-to-jaeger
  namespace: fieldops-observability
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fieldops-auth
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fieldops-core
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fieldops-reporting
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fieldops-gateway
      ports:
        - protocol: TCP
          port: 14268   # Jaeger collector HTTP
        - protocol: TCP
          port: 4317    # OTLP gRPC
        - protocol: TCP
          port: 4318    # OTLP HTTP
---
# Allow all components in the observability stack to talk to each other
# (Grafana -> Prometheus, Promtail -> Loki, Jaeger Query -> backend, etc.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-observability
  namespace: fieldops-observability
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: fieldops-observability
spec:
  podSelector: {}
  policyTypes:
    - Ingress
