apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup-daily
  namespace: fieldops-data
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: backup-job
          annotations:
            vault.hashicorp.com/agent-inject: "true"
            vault.hashicorp.com/agent-pre-populate-only: "true"
            vault.hashicorp.com/agent-extra-secret: "vault-approle-backup"
            vault.hashicorp.com/auth-type: "approle"
            vault.hashicorp.com/auth-path: "auth/approle"
            vault.hashicorp.com/auth-config-role-id-file-path: "/vault/custom/role-id"
            vault.hashicorp.com/auth-config-secret-id-file-path: "/vault/custom/secret-id"
            vault.hashicorp.com/role: "backup-job"
            vault.hashicorp.com/agent-inject-secret-db: "secret/data/postgresql"
            vault.hashicorp.com/agent-inject-template-db: |
              {{- with secret "secret/data/postgresql" -}}
              export PGPASSWORD="{{ .Data.data.password }}"
              {{- end -}}
            vault.hashicorp.com/agent-inject-secret-minio: "secret/data/minio"
            vault.hashicorp.com/agent-inject-template-minio: |
              {{- with secret "secret/data/minio" -}}
              export MINIO_ACCESS_KEY="{{ .Data.data.access_key }}"
              export MINIO_SECRET_KEY="{{ .Data.data.secret_key }}"
              {{- end -}}
        spec:
          restartPolicy: OnFailure
          serviceAccountName: backup-job
          containers:
            - name: pg-backup
              image: alpine:3.19
              command:
                - /bin/sh
                - -c
                - |
                  apk add --no-cache postgresql15-client
                  source /vault/secrets/db
                  source /vault/secrets/minio
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  echo "Starting pg_dump at ${TIMESTAMP}..."
                  pg_dump -h postgresql -U postgres -Fc -Z9 -f /tmp/backup_${TIMESTAMP}.dump fieldops_platform
                  echo "pg_dump complete. Installing MinIO client..."
                  wget -q https://dl.min.io/client/mc/release/linux-amd64/mc -O /usr/local/bin/mc && chmod +x /usr/local/bin/mc
                  mc alias set minio http://minio:9000 "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"
                  mc cp /tmp/backup_${TIMESTAMP}.dump minio/fieldops-backups/daily/
                  mc rm --recursive --older-than 90d minio/fieldops-backups/daily/ || true
                  echo "Backup and upload complete."
          volumes: []
