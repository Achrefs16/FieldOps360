apiVersion: batch/v1
kind: CronJob
metadata:
  name: redis-backup-daily
  namespace: fieldops-data
spec:
  schedule: "30 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: backup-job
          annotations:
            vault.hashicorp.com/agent-inject: "true"
            vault.hashicorp.com/agent-pre-populate-only: "true"
            vault.hashicorp.com/agent-extra-secret: "vault-approle-backup"
            vault.hashicorp.com/auth-type: "approle"
            vault.hashicorp.com/auth-path: "auth/approle"
            vault.hashicorp.com/auth-config-role-id-file-path: "/vault/custom/role-id"
            vault.hashicorp.com/auth-config-secret-id-file-path: "/vault/custom/secret-id"
            vault.hashicorp.com/role: "backup-job"
            vault.hashicorp.com/agent-inject-secret-redis: "secret/data/redis"
            vault.hashicorp.com/agent-inject-template-redis: |
              {{- with secret "secret/data/redis" -}}
              export REDIS_PASSWORD="{{ .Data.data.password }}"
              {{- end -}}
            vault.hashicorp.com/agent-inject-secret-minio: "secret/data/minio"
            vault.hashicorp.com/agent-inject-template-minio: |
              {{- with secret "secret/data/minio" -}}
              export MINIO_ACCESS_KEY="{{ .Data.data.access_key }}"
              export MINIO_SECRET_KEY="{{ .Data.data.secret_key }}"
              {{- end -}}
        spec:
          restartPolicy: OnFailure
          serviceAccountName: backup-job
          initContainers:
            - name: redis-dump
              image: redis:7-alpine
              command:
                - /bin/sh
                - -c
                - |
                  source /vault/secrets/redis
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  echo "Starting Redis RDB dump at ${TIMESTAMP}..."
                  redis-cli -h redis-master.fieldops-data.svc.cluster.local -a "$REDIS_PASSWORD" --rdb /backup/dump_${TIMESTAMP}.rdb
                  echo "${TIMESTAMP}" > /backup/timestamp
                  echo "Redis dump complete."
              volumeMounts:
                - name: backup-data
                  mountPath: /backup
                # vault-agent-init writes secrets here but webhook doesn't auto-mount
                # this on user-defined init containers — we add it explicitly
                - name: vault-secrets
                  mountPath: /vault/secrets
          containers:
            - name: mc-upload
              image: minio/mc:latest
              command:
                - /bin/sh
                - -c
                - |
                  source /vault/secrets/minio
                  TIMESTAMP=$(cat /backup/timestamp)
                  echo "Uploading redis_${TIMESTAMP}.rdb to MinIO..."
                  mc alias set minio http://minio:9000 "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"
                  mc cp /backup/dump_${TIMESTAMP}.rdb minio/fieldops-backups/redis/redis_${TIMESTAMP}.rdb
                  mc rm --recursive --older-than 30d minio/fieldops-backups/redis/
                  echo "Upload complete."
              volumeMounts:
                - name: backup-data
                  mountPath: /backup
          volumes:
            - name: backup-data
              emptyDir: {}
            - name: vault-secrets
              emptyDir:
                medium: Memory
