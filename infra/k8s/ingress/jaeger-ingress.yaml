---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: jaeger-stripprefix
  namespace: fieldops-observability
spec:
  stripPrefix:
    prefixes:
      - /jaeger
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jaeger-ingress
  namespace: fieldops-observability
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    - match: PathPrefix(`/jaeger`)
      kind: Rule
      middlewares:
        - name: jaeger-stripprefix
      services:
        - name: jaeger-query
          port: 16686
