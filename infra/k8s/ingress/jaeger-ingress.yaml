apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jaeger-ingress
  namespace: fieldops-observability
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    - match: Host(`jaeger.fieldops.local`)
      kind: Rule
      services:
        - name: jaeger-query
          port: 80
