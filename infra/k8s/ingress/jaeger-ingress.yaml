apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jaeger-ingress
  namespace: fieldops-observability
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    - match: PathPrefix(`/jaeger`)
      kind: Rule
      services:
        - name: jaeger-query
          port: 16686
          namespace: fieldops-observability
