apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: fieldops-observability
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    - match: Host(`grafana.fieldops.local`)
      kind: Rule
      services:
        - name: kube-prometheus-grafana
          port: 80
